<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="TheBridge is a community book marketplace for people who want to exchange, lend, rent, or sell physical books."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
      const token = (name) => `rgb(var(--c-${name}) / <alpha-value>)`;

      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: {
              sans: ["Manrope", "ui-sans-serif", "system-ui", "sans-serif"],
            },
            colors: {
              canvas: token("canvas"),
              chrome: token("chrome"),
              surface: {
                DEFAULT: token("surface"),
                muted: token("surface-muted"),
                raised: token("surface-raised"),
              },
              ink: {
                DEFAULT: token("ink"),
                muted: token("ink-muted"),
                subtle: token("ink-subtle"),
              },
              line: {
                DEFAULT: token("line"),
                strong: token("line-strong"),
              },
              wine: {
                DEFAULT: token("wine"),
                hover: token("wine-hover"),
                soft: token("wine-soft"),
                ink: token("wine-ink"),
                deep: token("wine-deep"),
              },
            },
            boxShadow: {
              card: "0 1px 2px rgb(36 28 30 / 0.04), 0 6px 20px -12px rgb(36 28 30 / 0.12)",
              lift: "0 2px 4px rgb(36 28 30 / 0.04), 0 18px 36px -18px rgb(36 28 30 / 0.22)",
            },
          },
        },
      };
    </script>

    <script>
      (() => {
        try {
          const savedTheme = localStorage.getItem("thebridge:theme");
          const prefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)"
          ).matches;

          if (savedTheme === "dark" || (!savedTheme && prefersDark)) {
            document.documentElement.classList.add("dark");
          }
        } catch {}
      })();
    </script>

    <title>TheBridge - Home</title>
    <script type="module" crossorigin src="/TheBridge/assets/index-B3xnJ4Kn.js"></script>
    <link rel="stylesheet" crossorigin href="/TheBridge/assets/index-C44ANm86.css">
  </head>

  <body
    class="min-h-screen overflow-x-hidden bg-canvas font-sans text-ink antialiased"
  >
    <div id="root"></div>

  </body>
</html>
