schema: spec-driven

context: |
  Language: English
  All artifacts must be written in English.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Project: TheBridge, a community book marketplace (Exchange, Loan, Rental, Sale) for small academic communities.
  Stack: React 19, Vite, React Router v6, Tailwind via CDN on the client; Express on the server.
  Planning sources of truth: _bmad-output/planning-artifacts/prd.md (numbered FR/NFR) and architecture.md (API contract).
  Data access goes only through client service modules (src/services/*); components never call fetch or localStorage directly.
  Visible UI text is English. Code files contain no comments.
  One story = one OpenSpec change = one branch feat/<epic>-<story>-<slug> = one pull request.

rules:
  proposal:
    - Reference the BMAD story id and the FR/NFR ids it covers
    - State what is out of scope
  tasks:
    - Keep at most 8 tasks; split the story if more are needed
    - Include lint, build, and manual verification as the final tasks

operations:
  apply:
    guidance:
      - Implement only the tasks in tasks.md; if reality differs, update the spec before the code
  archive:
    guidance:
      - Archive only after the reviewer approved the pull request and acceptance criteria pass
